name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:ci
      - run: npm run test:integration
      - run: npm run worker:check
# Delivery is configured in Cloudflare Workers Builds, not GitHub Pages.
# See docs/13-free-deployment.md. Never deploy untrusted PRs with account secrets.
