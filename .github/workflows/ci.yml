name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
      # Real deploys stay commented until this repo exists on GitHub and a
      # Cloudflare API token (Edit workers / D1 permissions) is stored as the
      # CLOUDFLARE_API_TOKEN repository secret. Then uncomment both steps:
      # - name: Deploy preview (PRs)
      #   if: github.event_name == 'pull_request'
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #   run: npx wrangler deploy --env preview
      # - name: Deploy main
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #   run: npx wrangler deploy
      # Alternatively connect the repo through the Cloudflare dashboard
      # (Workers & Pages > Create > Builds) with the same build command and
      # output directory "dist"; in that case leave these steps commented.
