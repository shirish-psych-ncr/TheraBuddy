# Static GitHub Pages delivery for the OFFLINE SYNTHETIC demo.
# This publishes only the browser app (IndexedDB + service worker). It does NOT
# run the staff/clinical API — that stays on the Cloudflare Worker preview per
# docs/13-free-deployment.md. On Pages, /staff.html links to the separately
# deployed Worker origin (VITE_API_BASE) and demo cross-device sync goes
# through an optional relay. Provider free-tier quotas apply.
name: Deploy static demo to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # For pull requests: verify only, never deploy.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit && npm run check:docs && npm run check:screens && npm test
      - name: Build for GitHub Pages (dry run)
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          AASHA_BASE: /${{ github.event.repository.name }}/
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Full verification first: audit, docs, unit tests, then a Pages-aware
      # build (repo-relative base, index.html + staff.html entries, PWA assets).
      - run: npm run audit && npm run check:docs && npm run check:screens && npm test
      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          AASHA_BASE: /${{ github.event.repository.name }}/
          # Optional: point /staff.html at the deployed Worker so sign-in works
          # on the Worker. Leave unset to show setup status on the
          # sign-in screen. Never put secrets in this value; it is public.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.output.outputs.page_url }}
    steps:
      - id: output
        uses: actions/deploy-pages@v4
